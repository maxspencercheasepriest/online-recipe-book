<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recipe Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  /* Azulejo tile kitchen: cobalt on glazed white, custard-gold for highlights.
     Layout: tile band + header, then home (category tile grid) / category (recipe cards) / recipe (ingredients | method). */
  --bg: #f6f8fc;
  --surface: #ffffff;
  --ink: #16213d;
  --muted: #5a6582;
  --cobalt: #1f4fa8;
  --cobalt-soft: #e3ebf9;
  --custard: #e2a72e;
  --line: #d6deee;
  --font-display: "DM Serif Display", Georgia, "Times New Roman", serif;
  --font-body: "Work Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1424; --surface: #161e33; --ink: #e8edf8; --muted: #9aa6c4;
    --cobalt: #7ea4ec; --cobalt-soft: #1d2a4a; --custard: #f0bd55; --line: #2a3655;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1424; --surface: #161e33; --ink: #e8edf8; --muted: #9aa6c4;
  --cobalt: #7ea4ec; --cobalt-soft: #1d2a4a; --custard: #f0bd55; --line: #2a3655;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.6;
}
a { color: var(--cobalt); }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 20px; }

.tiles {
  height: 48px;
  background-color: var(--cobalt);
  background-image:
    radial-gradient(circle at 50% 50%, var(--surface) 0 5px, transparent 6px),
    radial-gradient(circle at 0 0, var(--surface) 0 9px, transparent 10px),
    radial-gradient(circle at 100% 0, var(--surface) 0 9px, transparent 10px),
    radial-gradient(circle at 0 100%, var(--surface) 0 9px, transparent 10px),
    radial-gradient(circle at 100% 100%, var(--surface) 0 9px, transparent 10px);
  background-size: 48px 48px;
}

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 0 0; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-size: 1.35rem; color: var(--ink); text-decoration: none; }
.brand em { color: var(--cobalt); }
.crumbs { font-size: 14px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; }
.crumbs a { text-decoration: none; }
.crumbs a:hover { text-decoration: underline; }

.view { display: none; padding-bottom: 40px; }
.view.active { display: block; }

/* Home */
.hero { padding: 36px 0 24px; }
.hero h1 {
  font-family: var(--font-display); font-weight: 400;
  font-size: clamp(2.3rem, 5.5vw, 3.4rem); line-height: 1.08; margin: 0 0 10px;
  text-wrap: balance;
}
.hero h1 em { color: var(--cobalt); }
.hero p { margin: 0; color: var(--muted); max-width: 58ch; }

.search { margin: 22px 0 6px; position: relative; max-width: 460px; }
.search input {
  width: 100%; font: 400 16px var(--font-body); color: var(--ink);
  padding: 12px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface);
}
.search-results { display: grid; gap: 8px; margin-top: 12px; }

.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tag {
  display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
  font-size: 14px; font-weight: 500; padding: 6px 14px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
.tag:hover { border-color: var(--cobalt); color: var(--cobalt); }
.tag .n { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.recipe-head .tags { margin-top: 6px; }
.recipe-head .tag { font-size: 13px; padding: 4px 12px; }
/* Featured dish */
.feature {
  display: grid; grid-template-columns: 1.1fr 1fr; gap: 0; margin-top: 4px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 20px; overflow: hidden;
}
@media (max-width: 700px) { .feature { grid-template-columns: 1fr; } }
.feature .pic { position: relative; min-height: 260px; background: var(--cobalt-soft); }
.feature .pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.feature .body { padding: 24px 26px; display: grid; align-content: center; gap: 10px; }
.feature .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--custard); }
.feature h2 { font-family: var(--font-display); font-weight: 400; font-size: clamp(1.7rem, 4vw, 2.3rem); line-height: 1.1; margin: 0; text-wrap: balance; }
.feature p { margin: 0; color: var(--muted); }
.feature .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; font: 600 15px var(--font-body); cursor: pointer;
  padding: 10px 18px; border-radius: 999px; text-decoration: none; border: 1px solid var(--cobalt);
}
.btn.primary { background: var(--cobalt); color: var(--surface); }
.btn.ghost { background: transparent; color: var(--cobalt); }
.btn:hover { filter: brightness(1.08); }

/* Seasonal strip */
.season { margin-top: 30px; }
.season-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.season-head h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.6rem; margin: 0; }
.season-head h2 em { color: var(--custard); }
.season-head a { font-size: 14px; font-weight: 500; text-decoration: none; }
.strip {
  display: grid; grid-auto-flow: column; grid-auto-columns: minmax(180px, 220px); gap: 12px;
  overflow-x: auto; padding: 12px 2px 8px; scroll-snap-type: x mandatory;
}
.mini {
  scroll-snap-align: start; text-decoration: none; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
}
.mini:hover { border-color: var(--cobalt); }
.mini .ph { aspect-ratio: 1 / 1; background-size: 28px 28px; }
.mini .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.mini span { display: block; padding: 10px 12px 12px; font-size: 14px; font-weight: 500; line-height: 1.35; }
.countdown { font-size: 14px; color: var(--muted); }

.top-right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.lists-link { font-weight: 600; }
.muted { color: var(--muted); }
.small-print { font-size: 13px; color: var(--muted); margin-top: 18px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.new-list h2, .shop h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.35rem; margin: 0 0 12px; }
.form-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
.form-row label { display: grid; gap: 4px; font-size: 13px; font-weight: 500; color: var(--muted); }
.form-row input, .date-input, .add-row select, .atl-panel select, .atl-panel input {
  font: 400 15px var(--font-body); color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px;
}
.form-row input[type=text] { min-width: 220px; }
.form-row input[type=number] { width: 80px; }
.list-card .collage { display: flex; }
.list-card .collage img { flex: 1; min-width: 0; height: 100%; object-fit: cover; }
.list-card .collage .placeholder { width: 100%; height: 100%; }
.list-controls { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; padding: 14px 18px; }
.list-controls .servings { margin: 0; }
.btn.danger { border-color: #b3261e; color: #b3261e; }
.list-grid { display: grid; grid-template-columns: 1fr minmax(260px, 360px); gap: 26px; align-items: start; }
@media (max-width: 800px) { .list-grid { grid-template-columns: 1fr; } }
.list-h { font-family: var(--font-display); font-weight: 400; font-size: 1.35rem; margin: 0 0 12px; }
.list-h + * { margin-bottom: 8px; }
.entries { list-style: none; margin: 0 0 14px; padding: 0; display: grid; gap: 8px; }
.entry {
  display: grid; grid-template-columns: 48px 1fr auto auto auto; gap: 12px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px;
}
.entry img, .entry .dot { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; display: block; }
.entry-main { display: grid; min-width: 0; }
.entry-main a { font-weight: 600; text-decoration: none; color: var(--ink); }
.entry-main a:hover { color: var(--cobalt); }
.entry-main .muted { font-size: 13px; }
.entry .unit { font-size: 13px; }
.entry .stepper { justify-self: start; }
.stepper.small button { width: 30px; height: 30px; font-size: 16px; }
.stepper.small input { width: 42px; height: 30px; font-size: 14px; }
.remove { border: 0; background: transparent; color: var(--muted); font-size: 16px; cursor: pointer; padding: 6px; border-radius: 8px; }
.remove:hover { color: #b3261e; background: var(--cobalt-soft); }
@media (max-width: 520px) {
  .entry { grid-template-columns: 40px 1fr auto; }
  .entry img, .entry .dot { width: 40px; height: 40px; }
  .entry .stepper { grid-column: 2; }
  .entry .unit { grid-column: 3; grid-row: 2; }
  .entry .remove { grid-column: 3; grid-row: 1; }
}
.add-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 28px; }
.add-row select { flex: 1; min-width: 200px; }
.plan { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.plan > div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.plan h3 { margin: 0 0 8px; font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--custard); }
.plan ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.plan a { text-decoration: none; font-weight: 500; }
.shop-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 4px; }
.shop-head h2 { margin: 0; }
.shop .ingredients small { font-size: 12px; }
.shop .ingredients .detail { display: block; color: var(--muted); font-size: 12.5px; line-height: 1.4; margin-top: 2px; }
.shop .ingredients li label { grid-template-columns: 20px 92px 1fr; }
.shop-text { width: 100%; min-height: 160px; margin-top: 10px; font: 13px/1.5 var(--font-body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
.copy-msg { font-size: 13px; margin: 8px 0 0; }
.list-controls .actions { display: flex; flex-wrap: wrap; gap: 8px; }
.share-out { flex-basis: 100%; }
.share-out p { margin: 0; font-size: 14px; }
.share-out p:empty { display: none; }
.add-to-list { margin-top: 10px; display: grid; gap: 10px; justify-items: start; }
.atl-panel { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.atl-panel[hidden] { display: none; }
.atl-panel label { font-size: 13px; font-weight: 500; color: var(--muted); }
.section-label { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 30px 0 12px; }

.cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.cat {
  display: grid; grid-template-rows: auto 1fr auto; gap: 4px;
  text-decoration: none; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
  padding: 0 0 16px; overflow: hidden; min-height: 168px;
  transition: border-color .15s, transform .15s;
}
.cat:hover { border-color: var(--cobalt); }
.cat .swatch { height: 130px; background-color: var(--c); background-size: 32px 32px; margin-bottom: 10px; }
.cat .swatch.pic { height: 130px; background-size: cover; background-position: center; border-bottom: 5px solid var(--c); }
.cat h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.4rem; margin: 0; padding: 0 18px; line-height: 1.2; }
.cat p { margin: 0; padding: 0 18px; color: var(--muted); font-size: 14px; }
.cat .count { padding: 0 18px; font-size: 13px; font-weight: 600; color: var(--cobalt); font-variant-numeric: tabular-nums; }
.cat .count.zero { color: var(--muted); font-weight: 500; }

/* Category page */
.cat-head { padding: 30px 0 18px; display: grid; gap: 6px; }
.cat-head h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(2rem, 4.5vw, 2.8rem); margin: 0; line-height: 1.1; }
.cat-head p { margin: 0; color: var(--muted); max-width: 60ch; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.card {
  display: grid; gap: 8px; text-decoration: none; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px;
  border-top: 5px solid var(--cobalt);
}
.card:hover { border-color: var(--cobalt); }
.card .photo { margin: -18px -20px 4px; aspect-ratio: 4 / 3; overflow: hidden; border-radius: 11px 11px 0 0; }
.card .photo { position: relative; }
.card .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card .photo.placeholder { display: grid; place-items: center; }
.card .photo.placeholder span {
  font-family: var(--font-display); font-size: 1.25rem; color: #fff; text-align: center; padding: 0 18px;
  text-shadow: 0 1px 8px rgba(0,0,0,.35); text-wrap: balance;
}
.standin {
  position: absolute; left: 10px; bottom: 10px; font-size: 11px; font-weight: 600; letter-spacing: .04em;
  text-transform: uppercase; padding: 3px 8px; border-radius: 999px; background: rgba(22,33,61,.75); color: #fff;
}
.photo-wrap { position: relative; }
.card h3 { font-family: var(--font-display); font-weight: 400; font-size: 1.35rem; margin: 0; line-height: 1.2; }
.card p { margin: 0; color: var(--muted); font-size: 14px; }
.empty {
  background: var(--surface); border: 1px dashed var(--line); border-radius: 16px;
  padding: 28px; color: var(--muted); max-width: 520px;
}
.empty strong { color: var(--ink); display: block; margin-bottom: 4px; }

/* Recipe */
.recipe-head { display: grid; gap: 6px; padding: 28px 0 20px; }
.recipe-head h1 {
  font-family: var(--font-display); font-weight: 400; font-size: clamp(1.9rem, 4.5vw, 2.6rem); margin: 0; line-height: 1.12;
  text-wrap: balance;
}
.recipe-head p { margin: 0; color: var(--muted); max-width: 65ch; }
.recipe-photo { width: 100%; max-height: 420px; object-fit: cover; border-radius: 16px; display: block; margin-bottom: 8px; border: 1px solid var(--line); }
.recipe-head p.source { font-size: 14px; margin-top: 4px; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; }
.recipe-head .meta { margin-top: 8px; }
.chip {
  font-size: 13px; font-weight: 500; padding: 4px 12px; border-radius: 999px;
  background: var(--cobalt-soft); color: var(--cobalt);
}
.chip.hot { background: color-mix(in srgb, var(--custard) 24%, transparent); color: var(--ink); }

.grid { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; gap: 28px; align-items: start; }
@media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; }
.panel h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.35rem; margin: 0 0 14px; }

.servings { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.servings label { font-weight: 500; font-size: 14px; color: var(--muted); }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.stepper button {
  width: 36px; height: 34px; border: 0; background: var(--cobalt-soft); color: var(--cobalt);
  font-size: 18px; cursor: pointer;
}
.stepper input {
  width: 48px; height: 34px; border: 0; text-align: center; background: var(--surface); color: var(--ink);
  font: 600 15px var(--font-body); font-variant-numeric: tabular-nums;
}
.units { display: inline-flex; gap: 4px; }
.units button {
  font: 500 13px var(--font-body); padding: 5px 10px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: transparent; color: var(--muted);
}
.units button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }

ul.ingredients { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
ul.ingredients li label {
  display: grid; grid-template-columns: 20px 76px 1fr; gap: 10px; align-items: baseline;
  padding: 7px 4px; border-bottom: 1px dashed var(--line); cursor: pointer;
}
ul.ingredients li:last-child label { border-bottom: 0; }
ul.ingredients input { accent-color: var(--cobalt); margin: 0; transform: translateY(2px); }
.qty { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--cobalt); white-space: nowrap; }
ul.ingredients input:checked ~ span { text-decoration: line-through; color: var(--muted); }

ol.steps { list-style: none; margin: 0; padding: 0; counter-reset: step; display: grid; gap: 14px; }
ol.steps li {
  counter-increment: step; display: grid; grid-template-columns: 40px 1fr; gap: 14px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px;
}
ol.steps li::before {
  content: counter(step); font-family: var(--font-display); font-size: 1.5rem; line-height: 1;
  color: var(--cobalt); width: 40px; height: 40px; border-radius: 10px; background: var(--cobalt-soft);
  display: grid; place-items: center;
}
ol.steps h3 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
ol.steps p { margin: 0; }
.timer {
  margin-top: 10px; display: inline-flex; align-items: center; gap: 8px;
  font: 500 13px var(--font-body); padding: 5px 12px 5px 10px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: transparent; color: var(--ink); font-variant-numeric: tabular-nums;
}
.timer::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.timer.running::before { background: var(--custard); }
.timer.done { background: var(--custard); border-color: var(--custard); color: #16213d; }
.timer.done::before { background: #16213d; }

.note {
  margin-top: 20px; padding: 16px 18px; border-left: 4px solid var(--custard);
  background: var(--surface); border-radius: 0 12px 12px 0;
}
.note strong { display: block; margin-bottom: 2px; }

footer { color: var(--muted); font-size: 13px; padding: 10px 0 30px; border-top: 1px solid var(--line); }

a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid var(--custard); outline-offset: 2px; }

@media (prefers-reduced-motion: no-preference) {
  .view.active { animation: rise .22s ease-out; }
  @keyframes rise { from { transform: translateY(6px); } to { transform: none; } }
  .cat:hover { transform: translateY(-2px); }
}
</style>
</head>
<body>
<div class="tiles" aria-hidden="true"></div>
<div class="wrap">
  <div class="topbar">
    <a class="brand" href="#home">The <em>Recipe Book</em></a>
    <div class="top-right">
      <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
      <a class="tag lists-link" href="#lists">Event lists</a>
    </div>
  </div>

  <section class="view" id="view-home">
    <div class="hero">
      <h1>What are we <em>cooking</em>?</h1>
      <p>Pick a category or tag, or search every recipe by name or ingredient.</p>
      <div class="search">
        <label for="q" class="section-label" style="display:block;margin:0 0 6px">Search</label>
        <input id="q" type="search" placeholder="e.g. custard, port, apple" autocomplete="off">
      </div>
      <div class="search-results" id="results"></div>
    </div>
    <div id="feature"></div>
    <div id="season"></div>
    <div class="section-label">Browse by tag</div>
    <div class="tags" id="home-tags"></div>
    <div class="section-label">Categories</div>
    <div class="cats" id="cats"></div>
  </section>

  <section class="view" id="view-category"></section>
  <section class="view" id="view-recipe"></section>

  <footer>Oven temperatures are fan, with conventional in brackets.</footer>
</div>

<script>
/* ---------- Categories ---------- */
const CATEGORIES = [
  { id: "puddings",   name: "Puddings",          blurb: "Tarts, crumbles, custards and anything sweet after dinner.", color: "#1f4fa8" },
  { id: "roasts",     name: "Roasts",            blurb: "Sunday dinners, joints, birds and all the trimmings.",      color: "#8a3b2e" },
  { id: "indian",     name: "Indian",            blurb: "Curries, dals, breads and pickles.",                         color: "#c7731b" },
  { id: "asian",      name: "Asian",             blurb: "Stir-fries, noodles, dumplings and broths.",                 color: "#a3242f" },
  { id: "italian",    name: "Pasta & Italian",   blurb: "Sauces, bakes, risotto and fresh pasta.",                    color: "#3d7a3a" },
  { id: "soups",      name: "Soups & Stews",     blurb: "One-pot dishes for cold nights.",                            color: "#5b4a8a" },

/* ---------- Formatting ---------- */
let metric = true;
const servings = {};

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function fmtNum(n) {
  if (n >= 10) return String(Math.round(n));
  const fr = [[0.25,"¼"],[0.5,"½"],[0.75,"¾"],[0.33,"⅓"],[0.67,"⅔"]];
  const whole = Math.floor(n), rem = n - whole;
  if (rem < 0.08) return String(whole || "¼");
  if (rem > 0.92) return String(whole + 1);
  let best = fr[0];
  for (const f of fr) if (Math.abs(f[0] - rem) < Math.abs(best[0] - rem)) best = f;
  return (whole ? whole : "") + best[1];
}
function fmtQty(amount, unit) {
  if (!metric) {
    if (unit === "g") { const oz = amount / 28.35; return (oz < 10 ? Math.round(oz * 4) / 4 : Math.round(oz)) + " oz"; }
    if (unit === "ml") { const c = amount / 240; return fmtNum(c) + " cup" + (c > 1.1 ? "s" : ""); }
  }
  if (unit === "litre") return fmtNum(amount) + (amount > 1.05 ? " litres" : " litre");
  if (unit === "ml" && amount >= 1000) return (Math.round(amount / 100) / 10) + " litre" + (amount >= 1050 ? "s" : "");
  if (unit === "g" || unit === "ml") {
    return (amount < 50 ? Math.round(amount) : Math.round(amount / 5) * 5) + " " + unit;
  }
  if (!unit) return fmtNum(Math.max(1, Math.round(amount * 2) / 2));
  if (unit === "kg") return (Math.round(amount * 10) / 10) + " kg";
  if (unit === "cup") return fmtNum(amount) + (amount > 1.1 ? " cups" : " cup");
  return fmtNum(amount) + " " + unit;
}
function fmtTime(s) {
  if (s >= 3600) { const h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60); return h + " hr" + (m ? " " + m + " min" : ""); }
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
const fmtLabel = s => s >= 3600 ? fmtTime(s) : Math.round(s / 60) + " min";

function swatch(color) {
  return `background-color:${color};background-image:
    radial-gradient(circle at 50% 50%, rgba(255,255,255,.85) 0 3px, transparent 4px),
    radial-gradient(circle at 0 0, rgba(255,255,255,.85) 0 6px, transparent 7px),
    radial-gradient(circle at 100% 0, rgba(255,255,255,.85) 0 6px, transparent 7px),
    radial-gradient(circle at 0 100%, rgba(255,255,255,.85) 0 6px, transparent 7px),
    radial-gradient(circle at 100% 100%, rgba(255,255,255,.85) 0 6px, transparent 7px)`;
}
const countLabel = n => n === 0 ? "No recipes yet" : n === 1 ? "1 recipe" : n + " recipes";
const catOf = id => CATEGORIES.find(c => c.id === id);

/* ---------- Views ---------- */
function renderHome() {
  document.getElementById("cats").innerHTML = CATEGORIES.map(c => {
    const inCat = RECIPES.filter(r => r.category === c.id);
    const n = inCat.length;
    const cover = inCat.find(r => r.cover && r.photo) || inCat.find(r => r.photo && !r.standIn) || inCat.find(r => r.photo);
    const top = cover
      ? `<div class="swatch pic" style="--c:${c.color};background-image:url('${cover.photo}')" role="img" aria-label="${esc(cover.title)}"></div>`
      : `<div class="swatch" style="${swatch(c.color)}"></div>`;

function renderSeason() {
  const now = new Date();
  const m = now.getMonth(), d = now.getDate();
  const el = document.getElementById("season");
  const bonfire = (m === 9 && d >= 15) || (m === 10 && d <= 5);
  if (bonfire) {
    const bl = RECIPES.filter(r => (r.tags || []).includes("Bonfire night"));
    const left = Math.ceil((new Date(now.getFullYear(), 10, 5) - new Date(now.getFullYear(), m, d)) / 86400000);
    el.innerHTML = bl.length ? seasonStrip("Bonfire <em>night</em>", left > 0 ? `${left} day${left === 1 ? "" : "s"} to go` : "Remember, remember", "Bonfire night", bl) : "";
    return;
  }
  // Christmas from 6 November to 31 December
  if (m < 10) { el.innerHTML = ""; return; }
  const list = RECIPES.filter(r => (r.tags || []).includes("Christmas"));
  if (!list.length) { el.innerHTML = ""; return; }
  const xmas = new Date(now.getFullYear(), 11, 25);
  const days = Math.ceil((xmas - new Date(now.getFullYear(), m, d)) / 86400000);
  const when = days > 1 ? `${days} days to go` : days === 1 ? "It's Christmas Eve" : days === 0 ? "Merry Christmas" : "Leftover season";

}

let activeTimers = [];
function setupTimer(btn) {
  const total = Number(btn.dataset.secs);
  let left = total, iv = null;
  btn.addEventListener("click", () => {
    if (btn.classList.contains("done")) {
      btn.classList.remove("done"); left = total; btn.textContent = fmtLabel(total) + " timer"; return;
    }
    if (iv) { clearInterval(iv); iv = null; btn.classList.remove("running"); btn.textContent = "Paused · " + fmtTime(left); return; }
    btn.classList.add("running"); btn.textContent = fmtTime(left);
    iv = setInterval(() => {
      left--;
      if (left <= 0) {
        clearInterval(iv); iv = null;
        btn.classList.remove("running"); btn.classList.add("done");
        btn.textContent = "Done · tap to reset";
        try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {}
        return;
      }
      btn.textContent = fmtTime(left);
    }, 1000);
    activeTimers.push(() => clearInterval(iv));
  });
}

const LIST_KEY = "recipe-book-lists";
let memLists = [];
function loadLists() {
  try { const v = JSON.parse(localStorage.getItem(LIST_KEY)); if (Array.isArray(v)) { memLists = v; return v; } } catch (e) {}
  return memLists;
}
function saveLists(lists) {

}
function newListId() { return "list-" + Math.random().toString(36).slice(2, 8); }
const recipeById = id => RECIPES.find(r => r.id === id);

// How much of a recipe an entry makes: manual qty, else guests for people-based recipes, else the base batch.
function entryQty(entry, guests) {
  const r = recipeById(entry.r);
  if (!r) return 0;
  if (entry.qty) return entry.qty;
  return r.unit === "people" ? guests : (/glass|mug/.test(r.unit) ? guests : r.serves);
}
function ingredientAmount(r, ing, q) {
  return ing[3] === "plus1" ? q + 1 : ing[0] * q / r.serves;
}

/* Shopping list: ingredients are grouped into one line per item (all eggs, all sugar, all milk...).
   GROUPS: [pattern, group label, variant label or null to use the ingredient name, countsAs] */
const GROUPS = [
  [/egg yolk/, "Eggs", "yolks"], [/egg white/, "Eggs", "whites"], [/\beggs?\b/, "Eggs", "whole"],
  [/golden caster sugar/, "Sugar", "golden caster"], [/caster sugar/, "Sugar", "caster"], [/demerara/, "Sugar", "demerara"],
  [/icing sugar/, "Sugar", "icing"], [/dark brown/, "Sugar", "dark brown"], [/light brown/, "Sugar", "light brown"],
  [/brown sugar/, "Sugar", "brown"], [/\bsugar syrup\b/, "Sugar syrup", null], [/\bsugar\b/, "Sugar", "white"],
  [/milk chocolate/, "Chocolate", "milk"], [/dark chocolate|dark or milk chocolate/, "Chocolate", "dark"],
  [/chocolate/, "Chocolate", null],
  [/puff pastry/, "Puff pastry", null], [/shortcrust pastry/, "Shortcrust pastry", null],
  [/\bmilk\b/, "Milk", null], [/double cream/, "Double cream", null], [/whipped cream/, "Whipped cream", null],
  [/\bbutter\b(?! bean)/, "Butter", null],
  [/cornflour/, "Cornflour", null], [/self-raising flour/, "Flour", "self-raising"], [/strong white bread flour|bread flour/, "Flour", "strong white"],
  [/plain flour/, "Flour", "plain"], [/\bflour\b/, "Flour", null],
  [/\bsalt\b/, "Salt", null], [/black pepper|peppercorns/, "Black pepper", null],
  [/\bhoney\b/, "Honey", null], [/golden syrup/, "Golden syrup", null], [/black treacle/, "Black treacle", null],
  [/wild garlic/, "Wild garlic", null], [/garlic bulb/, "Garlic", "bulbs"], [/garlic clove/, "Garlic", "cloves"],
  [/spring onion/, "Spring onions", null], [/\bonions?\b/, "Onions", null],
  [/lemon juice/, "Lemons", "juice"], [/\blemon/, "Lemons", null], [/lime juice/, "Limes", "juice"], [/\blime/, "Limes", null],
  [/\borange\b/, "Oranges", null],
  [/cinnamon stick/, "Cinnamon", "sticks"], [/ground cinnamon/, "Cinnamon", "ground"],
  [/ground ginger/, "Ginger", "ground"], [/\bginger\b/, "Ginger", "fresh"],
  [/vanilla/, "Vanilla extract", null], [/\boil\b/, "Oil", null],
  [/chilli chutney/, "Trinidad Scorpion Chilli Chutney", null], [/\bchillies\b|\bchilli\b|jalapeño/, "Chillies", null],
  [/\brice\b/, "Rice", null], [/chorizo/, "Chorizo", null], [/rosemary/, "Rosemary", null], [/soy sauce/, "Soy sauce", null],
  [/hoisin/, "Hoisin sauce", null], [/ketchup/, "Ketchup", null], [/five spice/, "Chinese five spice", null],
  [/liquid smoke/, "Liquid smoke", null], [/bicarbonate/, "Bicarbonate of soda", null], [/paprika/, "Paprika", null],
  [/cloves\b/, "Cloves", null], [/star anise/, "Star anise", null], [/cardamom/, "Cardamom pods", null],
  [/vinegar/, "Vinegar", null], [/tawny port|\bport\b/, "Tawny port", null], [/\bwine\b(?! yeast)/, "Wine", null], [/tequila/, "Tequila blanco", null],
  [/bourbon|rye whiskey|\bwhisky\b/, "Whisky", null], [/\bapples?\b/, "Apples", null], [/\bwater\b/, "Water", null]
];
// Convert to a base unit per family so amounts add up.
function unitFamily(u, amt) {
  if (u === "g") return ["g", amt]; if (u === "kg") return ["g", amt * 1000];
  if (u === "ml") return ["ml", amt]; if (u === "litre") return ["ml", amt * 1000];
  if (u === "tsp") return ["tsp", amt]; if (u === "tbsp") return ["tsp", amt * 3];
  return [u || "", amt];
}
function fmtFamily(fam, amt) {
  if (fam === "g") return amt >= 1000 ? fmtQty(amt / 1000, "kg") : fmtQty(amt, "g");
  if (fam === "ml") return fmtQty(amt, "ml");
  if (fam === "tsp") return amt >= 3 ? fmtQty(amt / 3, "tbsp") : fmtQty(amt, "tsp");
  return fmtQty(amt, fam);
}
function classify(name) {
  const n = name.toLowerCase();
  for (const [re, group, variant] of GROUPS) if (re.test(n)) return { group, variant };
  return { group: name.charAt(0).toUpperCase() + name.slice(1), variant: null };
}

function shoppingList(list) {
  const groups = new Map();
  list.items.forEach(e => {
    const r = recipeById(e.r); if (!r) return;
    const q = entryQty(e, list.guests);
    r.ingredients.forEach(ing => {
      const { group, variant } = classify(ing[2]);
      const [fam, amt] = unitFamily(ing[1], ingredientAmount(r, ing, q));
      const g = groups.get(group) || { name: group, totals: new Map(), variants: new Map(), from: new Set(), raw: [] };
      g.totals.set(fam, (g.totals.get(fam) || 0) + amt);
      const vKey = (variant || ing[2]) + "|" + fam;
      const v = g.variants.get(vKey) || { label: variant || ing[2], fam, amt: 0 };
      v.amt += amt; g.variants.set(vKey, v);
      g.from.add(r.title);
      g.raw.push(ing[2]);
      groups.set(group, g);
    });
  });
  // Grams per teaspoon, so spoon amounts can join weighed amounts of the same thing.
  const DENSITY = { "Sugar": 4.2, "Golden syrup": 7, "Black treacle": 7, "Honey": 7, "Flour": 2.6, "Butter": 4.7 };
  const singular = (label, amt) => (Math.abs(amt - 1) < 0.01 && /s$/.test(label)) ? label.slice(0, -1) : label;
  return [...groups.values()].map(g => {
    const hasG = g.totals.has("g"), hasMl = g.totals.has("ml"), hasTsp = g.totals.has("tsp");
    const norm = (fam, amt) => {
      if (fam === "tsp" && hasG && DENSITY[g.name]) return ["g", amt * DENSITY[g.name]];
      if (fam === "tsp" && hasMl) return ["ml", amt * 5];
      if (fam === "pinch" && (hasTsp || hasG || hasMl)) return norm("tsp", amt / 16);
      return [fam, amt];
    };
    const totals = new Map();
    g.totals.forEach((amt, fam) => { const [f, a] = norm(fam, amt); totals.set(f, (totals.get(f) || 0) + a); });
    const variants = new Map();
    g.variants.forEach(v => {
      const [f, a] = norm(v.fam, v.amt);
      const k = v.label + "|" + f;
      const cur = variants.get(k) || { label: v.label, fam: f, amt: 0 };
      cur.amt += a; variants.set(k, cur);
    });
    const vs = [...variants.values()];
    const named = vs.filter(v => GROUPS.some(([re, grp, variant]) => grp === g.name && variant === v.label));
    let qty, name = g.name, detail = "";
    if (g.name === "Eggs") {
      const total = vs.reduce((sum, v) => sum + v.amt, 0);
      qty = fmtQty(total, "");
      const parts = vs.filter(v => v.label !== "whole");
      if (parts.length) detail = "includes " + parts.map(v => fmtQty(v.amt, "") + " " + singular(v.label, v.amt)).join(", ");
    } else {
      qty = [...totals.entries()].map(([fam, amt]) => fmtFamily(fam, amt)).join(" + ");
      const distinct = [...new Set(g.raw)];
      if (distinct.length === 1) name = distinct[0];
      else if (named.length > 1) detail = named.map(v => fmtFamily(v.fam, v.amt) + " " + singular(v.label, v.amt)).join(" · ");
    }
    return { name, qty, detail, from: [...g.from] };
  }).sort((a, b) => a.name.localeCompare(b.name));
}

  try { return new Date(d + "T12:00:00").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }); } catch (e) { return d; }

      guests: Math.max(1, parseInt(document.getElementById("nl-guests").value) || 6), items: [] };
    saveLists([...loadLists(), l]);
    location.hash = l.id;
  });
}

/* Share links: everything is packed into the #hash using only letters, digits and hyphens.
   share-<name as hex>-<guests>-<date yyyymmdd or 0>-<recipe code + amount>... */
function recipeCode(id) {
  let h = 5381;
  for (let i = 0; i < id.length; i++) h = ((h * 33) ^ id.charCodeAt(i)) >>> 0;
  return h.toString(36).padStart(5, "0").slice(-5);
}
function toHex(str) { return Array.from(new TextEncoder().encode(str)).map(b => b.toString(16).padStart(2, "0")).join(""); }
function fromHex(hex) {
  const bytes = new Uint8Array((hex.match(/../g) || []).map(h => parseInt(h, 16)));
  return new TextDecoder().decode(bytes);
}
function encodeShare(list) {
  const parts = ["share", toHex(list.name.slice(0, 60)), String(list.guests), list.date ? list.date.replace(/-/g, "") : "0"];
  list.items.forEach(e => parts.push(recipeCode(e.r) + (e.qty ? Math.round(e.qty * 10).toString(36) : "")));
  return parts.join("-");
}
function decodeShare(id) {
  try {
    const t = id.split("-");
    if (t[0] !== "share" || t.length < 4) return null;
    const name = fromHex(t[1]) || "Shared list";
    const guests = Math.max(1, Math.min(99, parseInt(t[2]) || 6));
    const date = /^\d{8}$/.test(t[3]) ? t[3].slice(0, 4) + "-" + t[3].slice(4, 6) + "-" + t[3].slice(6) : "";
    const byCode = new Map(RECIPES.map(r => [recipeCode(r.id), r.id]));
    const items = t.slice(4).map(tok => {
      const r = byCode.get(tok.slice(0, 5));
      const q = tok.length > 5 ? parseInt(tok.slice(5), 36) / 10 : null;
      return r ? { r, qty: q || null } : null;
    }).filter(Boolean);
    return { id, name, date, guests, items };
  } catch (e) { return null; }
}
function shareUrl(list) { return location.href.split("#")[0] + "#" + encodeShare(list); }
function listText(list) {
  const shop = shoppingList(list);
  const head = list.name + (list.date ? " (" + fmtDate(list.date) + ")" : "") + " · " + list.guests + " guests";
  const recipes = list.items.map(e => { const r = recipeById(e.r); return r ? "- " + r.title + " (" + fmtNum(entryQty(e, list.guests)) + " " + r.unit + ")" : ""; }).filter(Boolean);
  return [head, "", "Recipes:", ...recipes, "", "Shopping list:", ...shop.map(s => "- " + s.qty + " " + s.name + (s.detail ? " (" + s.detail + ")" : "")), "", "Open the list: " + shareUrl(list)].join("\n");
}
async function copyOut(view, text, okMsg) {
  const msg = view.querySelector("#share-msg");
  const box = view.querySelector("#share-box");
  try {
    await navigator.clipboard.writeText(text);
    box.hidden = true;
    msg.textContent = okMsg;
  } catch (e) {
    box.hidden = false; box.value = text; box.focus(); box.select();
    msg.textContent = "Couldn't copy automatically. It's selected in the box below, so copy it from there.";
  }
}

let menuDraft = null; // ready-made menus and shared lists are edited in memory until saved
function renderList(id) {
  const isShared = id.startsWith("share-");
  const isMenu = id.startsWith("menu-") || isShared;
  let list;
  if (isMenu) {
    if (!menuDraft || menuDraft.id !== id) {
      if (isShared) {
        menuDraft = decodeShare(id);
        if (!menuDraft) return false;
      } else {
        const m = MENUS.find(x => x.id === id);
        if (!m) return false;
        menuDraft = { id, name: m.name, date: "", guests: m.guests, items: m.items.map(r => ({ r, qty: null })) };
      }
    }
    list = menuDraft;
  } else {
    list = loadLists().find(l => l.id === id);
    if (!list) return false;
  }
  const commit = () => {
    if (isMenu) { menuDraft = list; }
    else saveLists(loadLists().map(l => l.id === list.id ? list : l));
    renderList(id);
  };
  const items = list.items.map(e => ({ e, r: recipeById(e.r) })).filter(x => x.r);
  const ahead = items.filter(x => (x.r.tags || []).includes("Make-ahead"));
  const onDay = items.filter(x => !(x.r.tags || []).includes("Make-ahead"));
  const shop = shoppingList(list);
  const options = CATEGORIES.map(c => {
    const rs = RECIPES.filter(r => r.category === c.id && !list.items.some(e => e.r === r.id));
    return rs.length ? `<optgroup label="${esc(c.name)}">${rs.map(r => `<option value="${r.id}">${esc(r.title)}</option>`).join("")}</optgroup>` : "";
  }).join("");

  const planRow = x => `<li><a href="#${x.r.id}">${esc(x.r.title)}</a> <span class="muted">· ${fmtNum(entryQty(x.e, list.guests))} ${esc(x.r.unit)}</span></li>`;

  document.getElementById("view-category").innerHTML = `
    <div class="cat-head">
      <h1>${esc(list.name)}</h1>
      <p>${isShared ? `Someone shared this list with you${list.date ? " for " + esc(fmtDate(list.date)) : ""}. Save it to keep your own copy.` : isMenu ? "Ready-made menu. Change anything you like, then save it as your own list." : (list.date ? esc(fmtDate(list.date)) : "No date set")}</p>
    </div>
    <div class="list-controls panel">
      <div class="servings">
        <label for="lg">Guests</label>
        <span class="stepper">
          <button type="button" aria-label="Fewer guests" data-g="-1">−</button>
          <input id="lg" type="number" min="1" max="99" value="${list.guests}">
          <button type="button" aria-label="More guests" data-g="1">+</button>
        </span>
        ${isMenu ? "" : `<label for="ld" style="margin-left:8px">Date</label><input id="ld" class="date-input" type="date" value="${esc(list.date || "")}">`}
      </div>
      <div class="actions">
        <button type="button" class="btn ghost" id="share-link">Share link</button>
        <button type="button" class="btn ghost" id="copy-text">Copy as text</button>
        ${isMenu ? `<button type="button" class="btn primary" id="save-menu">Save as my list</button>` : `<button type="button" class="btn ghost" id="dup-list">Duplicate</button>
        <button type="button" class="btn ghost danger" id="del-list">Delete list</button>`}
      </div>
      <div class="share-out">
        <p class="muted" id="share-msg" role="status"></p>
        <textarea id="share-box" class="shop-text" hidden readonly aria-label="List to copy"></textarea>
      </div>
    </div>

    <div class="list-grid">
      <section>
        <h2 class="list-h">Recipes</h2>
        ${items.length ? `<ul class="entries">${items.map((x, i) => `
          <li class="entry">
            ${x.r.photo ? `<img src="${x.r.photo}" alt="">` : `<span class="dot" style="${swatch(catOf(x.r.category).color)};background-size:16px 16px"></span>`}
            <div class="entry-main">
              <a href="#${x.r.id}">${esc(x.r.title)}</a>
              <span class="muted">${esc(catOf(x.r.category).name)}</span>
            </div>
            <span class="stepper small">
              <button type="button" aria-label="Less" data-i="${i}" data-d="-1">−</button>
              <input type="number" min="1" max="99" value="${fmtNumPlain(entryQty(x.e, list.guests))}" data-i="${i}" aria-label="How much of ${esc(x.r.title)}">
              <button type="button" aria-label="More" data-i="${i}" data-d="1">+</button>
            </span>
            <span class="muted unit">${esc(x.r.unit)}</span>
            <button type="button" class="remove" data-rm="${i}" aria-label="Remove ${esc(x.r.title)}">✕</button>
          </li>`).join("")}</ul>` : `<div class="empty"><strong>Nothing on this list yet.</strong>Add recipes below, or use "Add to a list" on any recipe page.</div>`}
        ${options ? `<div class="add-row">
          <label for="add-r" class="sr-only">Add a recipe</label>
          <select id="add-r"><option value="">Add a recipe…</option>${options}</select>
          <button type="button" class="btn primary" id="add-btn">Add</button>
        </div>` : ""}

        ${items.length ? `<h2 class="list-h">Plan</h2>
        <div class="plan">
          ${ahead.length ? `<div><h3>Do ahead</h3><ul>${ahead.map(planRow).join("")}</ul></div>` : ""}
          ${onDay.length ? `<div><h3>On the day</h3><ul>${onDay.map(planRow).join("")}</ul></div>` : ""}
        </div>` : ""}
      </section>

      <aside class="panel shop">
        <div class="shop-head">
          <h2>Shopping list</h2>
          ${shop.length ? `<button type="button" class="btn ghost" id="copy-shop">Copy</button>` : ""}
        </div>
        ${shop.length ? `<ul class="ingredients">${shop.map((s, i) => `
          <li><label for="sh-${i}">
            <input type="checkbox" id="sh-${i}">
            <span class="qty">${esc(s.qty)}</span>
            <span>${esc(s.name)}${s.from.length > 1 ? `<small class="muted"> · ${s.from.length} recipes</small>` : ""}${s.detail ? `<small class="detail">${esc(s.detail)}</small>` : ""}</span>
          </label></li>`).join("")}</ul>` : `<p class="muted">Add recipes to build the shopping list.</p>`}
        <textarea id="shop-text" class="sr-only" readonly aria-hidden="true">${esc(list.name + " shopping list\n" + shop.map(s => "- " + s.qty + " " + s.name + (s.detail ? " (" + s.detail + ")" : "")).join("\n"))}</textarea>
        <p class="copy-msg muted" id="copy-msg" role="status"></p>
      </aside>
    </div>`;

  const view = document.getElementById("view-category");
  const g = view.querySelector("#lg");
  const setGuests = v => { list.guests = Math.max(1, Math.min(99, parseInt(v) || 1)); commit(); };
  g.addEventListener("change", () => setGuests(g.value));
  view.querySelectorAll("[data-g]").forEach(b => b.addEventListener("click", () => setGuests(list.guests + Number(b.dataset.g))));
  const d = view.querySelector("#ld");
  if (d) d.addEventListener("change", () => { list.date = d.value; commit(); });

  view.querySelectorAll(".entry input[data-i]").forEach(inp => inp.addEventListener("change", () => {
    items[inp.dataset.i].e.qty = Math.max(1, parseFloat(inp.value) || 1); commit();
  }));
  view.querySelectorAll(".entry button[data-d]").forEach(b => b.addEventListener("click", () => {
    const x = items[b.dataset.i];
    x.e.qty = Math.max(1, entryQty(x.e, list.guests) + Number(b.dataset.d)); commit();
  }));
  view.querySelectorAll("[data-rm]").forEach(b => b.addEventListener("click", () => {
    const rid = items[b.dataset.rm].e.r;
    list.items = list.items.filter(e => e.r !== rid); commit();
  }));
  const addBtn = view.querySelector("#add-btn");
  if (addBtn) addBtn.addEventListener("click", () => {
    const v = view.querySelector("#add-r").value;
    if (!v) return;
    list.items.push({ r: v, qty: null }); commit();
  });

  const copy = view.querySelector("#copy-shop");
  if (copy) copy.addEventListener("click", async () => {
    const text = view.querySelector("#shop-text").value;
    const msg = view.querySelector("#copy-msg");
    try { await navigator.clipboard.writeText(text); msg.textContent = "Copied. Paste it into your notes or a message."; }
    catch (e) {
      const ta = view.querySelector("#shop-text");
      ta.classList.remove("sr-only"); ta.classList.add("shop-text"); ta.removeAttribute("aria-hidden");
      ta.focus(); ta.select();
      msg.textContent = "Couldn't copy automatically. The list is selected above, so copy it from there.";
    }
  });

  const save = view.querySelector("#save-menu");
  if (save) save.addEventListener("click", () => {
    const l = { id: newListId(), name: list.name, date: list.date || "", guests: list.guests, items: list.items.map(e => ({ ...e })) };
    saveLists([...loadLists(), l]);
    menuDraft = null;
    location.hash = l.id;
  });
  view.querySelector("#share-link").addEventListener("click", () =>
    copyOut(view, shareUrl(list), "Link copied. Anyone who opens it sees this list and can save their own copy."));
  view.querySelector("#copy-text").addEventListener("click", () =>
    copyOut(view, listText(list), "Copied the recipes and shopping list as text, ready to paste into a message."));
  const dup = view.querySelector("#dup-list");
  if (dup) dup.addEventListener("click", () => {
    const l = { id: newListId(), name: list.name + " (copy)", date: list.date || "", guests: list.guests, items: list.items.map(e => ({ ...e })) };
    saveLists([...loadLists(), l]);
    location.hash = l.id;
  });
  const del = view.querySelector("#del-list");
  if (del) del.addEventListener("click", () => {
    if (del.dataset.armed) {
      saveLists(loadLists().filter(l => l.id !== list.id));
      location.hash = "lists";
    } else {
      del.dataset.armed = "1"; del.textContent = "Tap again to delete";
      setTimeout(() => { if (del.isConnected) { delete del.dataset.armed; del.textContent = "Delete list"; } }, 4000);
    }
  });
  return true;
}
function fmtNumPlain(n) { return Math.round(n * 10) / 10; }

// "Add to a list" panel on recipe pages
function addToListPanel(r) {
  const lists = loadLists();
  return `<div class="add-to-list">
    <button type="button" class="btn ghost" id="atl-open">Add to a list</button>
    <div class="atl-panel" id="atl-panel" hidden>
      <label for="atl-select">List</label>
      <select id="atl-select">
        ${lists.map(l => `<option value="${l.id}">${esc(l.name)}${l.items.some(e => e.r === r.id) ? " (already added)" : ""}</option>`).join("")}
        <option value="__new">New list…</option>
      </select>
      <input id="atl-name" type="text" placeholder="New list name" ${lists.length ? "hidden" : ""} aria-label="New list name">
      <button type="button" class="btn primary" id="atl-add">Add</button>
      <span class="muted" id="atl-msg" role="status"></span>
    </div>
  </div>`;
}
function wireAddToList(r) {
  const open = document.getElementById("atl-open");
  if (!open) return;
  const panel = document.getElementById("atl-panel");
  const sel = document.getElementById("atl-select");
  const name = document.getElementById("atl-name");
  if (!loadLists().length) sel.value = "__new";
  open.addEventListener("click", () => { panel.hidden = !panel.hidden; });
  sel.addEventListener("change", () => { name.hidden = sel.value !== "__new"; if (!name.hidden) name.focus(); });
  document.getElementById("atl-add").addEventListener("click", () => {
    let lists = loadLists(), target;
    if (sel.value === "__new") {
      const n = name.value.trim();
      if (!n) { name.focus(); return; }
      target = { id: newListId(), name: n, date: "", guests: 6, items: [] };
      lists = [...lists, target];
    } else {
      target = lists.find(l => l.id === sel.value);
    }
    if (!target.items.some(e => e.r === r.id)) target.items.push({ r: r.id, qty: null });
    saveLists(lists.map(l => l.id === target.id ? target : l));
    document.getElementById("atl-msg").innerHTML = `Added to <a href="#${target.id}">${esc(target.name)}</a>.`;
  });
}

/* ---------- Routing ---------- */
function setCrumbs(parts) {
  document.getElementById("crumbs").innerHTML = parts.map((p, i) =>
    (i ? "<span aria-hidden='true'>›</span>" : "") +
    (p.href ? `<a href="${p.href}">${esc(p.label)}</a>` : `<span aria-current="page">${esc(p.label)}</span>`)
  ).join("");
}

function route() {
  activeTimers.forEach(f => f()); activeTimers = [];
  const id = location.hash.slice(1);
  const cat = catOf(id);
  const rec = RECIPES.find(r => r.id === id);
  const tag = tagFromSlug(id);
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));

  if (id === "lists") {
    renderLists();
    document.getElementById("view-category").classList.add("active");
    setCrumbs([{ label: "Home", href: "#home" }, { label: "Event lists" }]);
    document.title = "Event lists · Recipe Book";
  } else if ((id.startsWith("list-") || id.startsWith("menu-") || id.startsWith("share-")) && renderList(id)) {
    document.getElementById("view-category").classList.add("active");
    const nm = document.querySelector("#view-category h1").textContent;
    setCrumbs([{ label: "Home", href: "#home" }, { label: "Event lists", href: "#lists" }, { label: nm }]);
    document.title = nm + " · Recipe Book";
  } else if (rec) {
    const c = catOf(rec.category);
    renderRecipe(rec);
    document.getElementById("view-recipe").classList.add("active");
    setCrumbs([{ label: "Home", href: "#home" }, { label: c.name, href: "#" + c.id }, { label: rec.title }]);
    document.title = rec.title + " · Recipe Book";
  } else if (tag) {
    renderTag(tag);
    document.getElementById("view-category").classList.add("active");
    setCrumbs([{ label: "Home", href: "#home" }, { label: tag }]);
    document.title = tag + " · Recipe Book";
  } else if (cat) {
    renderCategory(cat);
    document.getElementById("view-category").classList.add("active");
    setCrumbs([{ label: "Home", href: "#home" }, { label: cat.name }]);
    document.title = cat.name + " · Recipe Book";
  } else {
    document.getElementById("view-home").classList.add("active");
    setCrumbs([]);
    document.title = "Recipe Book";
  }
  window.scrollTo(0, 0);
}

renderHome();
renderHomeTags();
renderFeature(false);
renderSeason();
document.getElementById("q").addEventListener("input", renderSearch);
window.addEventListener("hashchange", route);
route();
</script>
