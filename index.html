<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recipe Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  /* Azulejo tile kitchen: cobalt on glazed white, custard-gold for highlights.
     Layout: tile band + header, then home (category tile grid) / category (recipe cards) / recipe (ingredients | method). */
  --bg: #f6f8fc;
  --surface: #ffffff;
  --ink: #16213d;
  --muted: #5a6582;
  --cobalt: #1f4fa8;
  --cobalt-soft: #e3ebf9;
  --custard: #e2a72e;
  --line: #d6deee;
  --font-display: "DM Serif Display", Georgia, "Times New Roman", serif;
  --font-body: "Work Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1424; --surface: #161e33; --ink: #e8edf8; --muted: #9aa6c4;
    --cobalt: #7ea4ec; --cobalt-soft: #1d2a4a; --custard: #f0bd55; --line: #2a3655;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1424; --surface: #161e33; --ink: #e8edf8; --muted: #9aa6c4;
  --cobalt: #7ea4ec; --cobalt-soft: #1d2a4a; --custard: #f0bd55; --line: #2a3655;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.6;
}
a { color: var(--cobalt); }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 20px; }

.tiles {
  height: 48px;
  background-color: var(--cobalt);
  background-image:
    radial-gradient(circle at 50% 50%, var(--surface) 0 5px, transparent 6px),
    radial-gradient(circle at 0 0, var(--surface) 0 9px, transparent 10px),
    radial-gradient(circle at 100% 0, var(--surface) 0 9px, transparent 10px),
    radial-gradient(circle at 0 100%, var(--surface) 0 9px, transparent 10px),
    radial-gradient(circle at 100% 100%, var(--surface) 0 9px, transparent 10px);
  background-size: 48px 48px;
}

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 0 0; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-size: 1.35rem; color: var(--ink); text-decoration: none; }
.brand em { color: var(--cobalt); }
.crumbs { font-size: 14px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; }
.crumbs a { text-decoration: none; }
.crumbs a:hover { text-decoration: underline; }

.view { display: none; padding-bottom: 40px; }
.view.active { display: block; }

/* Home */
.hero { padding: 36px 0 24px; }
.hero h1 {
  font-family: var(--font-display); font-weight: 400;
  font-size: clamp(2.3rem, 5.5vw, 3.4rem); line-height: 1.08; margin: 0 0 10px;
  text-wrap: balance;
}
.hero h1 em { color: var(--cobalt); }
.hero p { margin: 0; color: var(--muted); max-width: 58ch; }

.search { margin: 22px 0 6px; position: relative; max-width: 460px; }
.search input {
  width: 100%; font: 400 16px var(--font-body); color: var(--ink);
  padding: 12px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface);
}
.search-results { display: grid; gap: 8px; margin-top: 12px; }

.section-label { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 30px 0 12px; }

.cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.cat {
  display: grid; grid-template-rows: auto 1fr auto; gap: 4px;
  text-decoration: none; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
  padding: 0 0 16px; overflow: hidden; min-height: 168px;
  transition: border-color .15s, transform .15s;
}
.cat:hover { border-color: var(--cobalt); }
.cat .swatch { height: 64px; background-color: var(--c); background-size: 32px 32px; margin-bottom: 10px; }
.cat h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.4rem; margin: 0; padding: 0 18px; line-height: 1.2; }
.cat p { margin: 0; padding: 0 18px; color: var(--muted); font-size: 14px; }
.cat .count { padding: 0 18px; font-size: 13px; font-weight: 600; color: var(--cobalt); font-variant-numeric: tabular-nums; }
.cat .count.zero { color: var(--muted); font-weight: 500; }

/* Category page */
.cat-head { padding: 30px 0 18px; display: grid; gap: 6px; }
.cat-head h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(2rem, 4.5vw, 2.8rem); margin: 0; line-height: 1.1; }
.cat-head p { margin: 0; color: var(--muted); max-width: 60ch; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.card {
  display: grid; gap: 8px; text-decoration: none; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px;
  border-top: 5px solid var(--cobalt);
}
.card:hover { border-color: var(--cobalt); }
.card .photo { margin: -18px -20px 4px; aspect-ratio: 4 / 3; overflow: hidden; border-radius: 11px 11px 0 0; }
.card .photo { position: relative; }
.card .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card .photo.placeholder { display: grid; place-items: center; }
.card .photo.placeholder span {
  font-family: var(--font-display); font-size: 1.25rem; color: #fff; text-align: center; padding: 0 18px;
  text-shadow: 0 1px 8px rgba(0,0,0,.35); text-wrap: balance;
}
.standin {
  position: absolute; left: 10px; bottom: 10px; font-size: 11px; font-weight: 600; letter-spacing: .04em;
  text-transform: uppercase; padding: 3px 8px; border-radius: 999px; background: rgba(22,33,61,.75); color: #fff;
}
.photo-wrap { position: relative; }
.card h3 { font-family: var(--font-display); font-weight: 400; font-size: 1.35rem; margin: 0; line-height: 1.2; }
.card p { margin: 0; color: var(--muted); font-size: 14px; }
.empty {
  background: var(--surface); border: 1px dashed var(--line); border-radius: 16px;
  padding: 28px; color: var(--muted); max-width: 520px;
}
.empty strong { color: var(--ink); display: block; margin-bottom: 4px; }

/* Recipe */
.recipe-head { display: grid; gap: 6px; padding: 28px 0 20px; }
.recipe-head h1 {
  font-family: var(--font-display); font-weight: 400; font-size: clamp(1.9rem, 4.5vw, 2.6rem); margin: 0; line-height: 1.12;
  text-wrap: balance;
}
.recipe-head p { margin: 0; color: var(--muted); max-width: 65ch; }
.recipe-photo { width: 100%; max-height: 420px; object-fit: cover; border-radius: 16px; display: block; margin-bottom: 8px; border: 1px solid var(--line); }
.recipe-head p.source { font-size: 14px; margin-top: 4px; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; }
.recipe-head .meta { margin-top: 8px; }
.chip {
  font-size: 13px; font-weight: 500; padding: 4px 12px; border-radius: 999px;
  background: var(--cobalt-soft); color: var(--cobalt);
}
.chip.hot { background: color-mix(in srgb, var(--custard) 24%, transparent); color: var(--ink); }

.grid { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; gap: 28px; align-items: start; }
@media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; }
.panel h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.35rem; margin: 0 0 14px; }

.servings { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.servings label { font-weight: 500; font-size: 14px; color: var(--muted); }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.stepper button {
  width: 36px; height: 34px; border: 0; background: var(--cobalt-soft); color: var(--cobalt);
  font-size: 18px; cursor: pointer;
}
.stepper input {
  width: 48px; height: 34px; border: 0; text-align: center; background: var(--surface); color: var(--ink);
  font: 600 15px var(--font-body); font-variant-numeric: tabular-nums;
}
.units { display: inline-flex; gap: 4px; }
.units button {
  font: 500 13px var(--font-body); padding: 5px 10px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: transparent; color: var(--muted);
}
.units button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }

ul.ingredients { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
ul.ingredients li label {
  display: grid; grid-template-columns: 20px 76px 1fr; gap: 10px; align-items: baseline;
  padding: 7px 4px; border-bottom: 1px dashed var(--line); cursor: pointer;
}
ul.ingredients li:last-child label { border-bottom: 0; }
ul.ingredients input { accent-color: var(--cobalt); margin: 0; transform: translateY(2px); }
.qty { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--cobalt); white-space: nowrap; }
ul.ingredients input:checked ~ span { text-decoration: line-through; color: var(--muted); }

ol.steps { list-style: none; margin: 0; padding: 0; counter-reset: step; display: grid; gap: 14px; }
ol.steps li {
  counter-increment: step; display: grid; grid-template-columns: 40px 1fr; gap: 14px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px;
}
ol.steps li::before {
  content: counter(step); font-family: var(--font-display); font-size: 1.5rem; line-height: 1;
  color: var(--cobalt); width: 40px; height: 40px; border-radius: 10px; background: var(--cobalt-soft);
  display: grid; place-items: center;
}
ol.steps h3 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
ol.steps p { margin: 0; }
.timer {
  margin-top: 10px; display: inline-flex; align-items: center; gap: 8px;
  font: 500 13px var(--font-body); padding: 5px 12px 5px 10px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: transparent; color: var(--ink); font-variant-numeric: tabular-nums;
}
.timer::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.timer.running::before { background: var(--custard); }
.timer.done { background: var(--custard); border-color: var(--custard); color: #16213d; }
.timer.done::before { background: #16213d; }

.note {
  margin-top: 20px; padding: 16px 18px; border-left: 4px solid var(--custard);
  background: var(--surface); border-radius: 0 12px 12px 0;
}
.note strong { display: block; margin-bottom: 2px; }

footer { color: var(--muted); font-size: 13px; padding: 10px 0 30px; border-top: 1px solid var(--line); }

a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid var(--custard); outline-offset: 2px; }

@media (prefers-reduced-motion: no-preference) {
  .view.active { animation: rise .22s ease-out; }
  @keyframes rise { from { transform: translateY(6px); } to { transform: none; } }
  .cat:hover { transform: translateY(-2px); }
}
</style>
</head>
<body>
<div class="tiles" aria-hidden="true"></div>
<div class="wrap">
  <div class="topbar">
    <a class="brand" href="#home">The <em>Recipe Book</em></a>
    <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
  </div>

  <section class="view" id="view-home">
    <div class="hero">
      <h1>What are we <em>cooking</em>?</h1>
      <p>Pick a category, or search every recipe by name or ingredient.</p>
      <div class="search">
        <label for="q" class="section-label" style="display:block;margin:0 0 6px">Search</label>
        <input id="q" type="search" placeholder="e.g. custard, port, apple" autocomplete="off">
      </div>
      <div class="search-results" id="results"></div>
    </div>
    <div class="section-label">Categories</div>
    <div class="cats" id="cats"></div>
  </section>

  <section class="view" id="view-category"></section>
  <section class="view" id="view-recipe"></section>

  <footer>Oven temperatures are fan, with conventional in brackets.</footer>
</div>

<script>

/* ---------- Formatting ---------- */
let metric = true;
const servings = {};

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function fmtNum(n) {
  if (n >= 10) return String(Math.round(n));
  const fr = [[0.25,"¼"],[0.5,"½"],[0.75,"¾"],[0.33,"⅓"],[0.67,"⅔"]];
  const whole = Math.floor(n), rem = n - whole;
  if (rem < 0.08) return String(whole || "¼");
  if (rem > 0.92) return String(whole + 1);
  let best = fr[0];
  for (const f of fr) if (Math.abs(f[0] - rem) < Math.abs(best[0] - rem)) best = f;
  return (whole ? whole : "") + best[1];
}
function fmtQty(amount, unit) {
  if (!metric) {
    if (unit === "g") { const oz = amount / 28.35; return (oz < 10 ? Math.round(oz * 4) / 4 : Math.round(oz)) + " oz"; }
    if (unit === "ml") { const c = amount / 240; return fmtNum(c) + " cup" + (c > 1.1 ? "s" : ""); }
  }
  if (unit === "g" || unit === "ml") {
    return (amount < 50 ? Math.round(amount) : Math.round(amount / 5) * 5) + " " + unit;
  }
  if (!unit) return fmtNum(Math.max(1, Math.round(amount * 2) / 2));
  if (unit === "cup") return fmtNum(amount) + (amount > 1.1 ? " cups" : " cup");
  return fmtNum(amount) + " " + unit;
}
function fmtTime(s) {
  if (s >= 3600) { const h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60); return h + " hr" + (m ? " " + m + " min" : ""); }
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
const fmtLabel = s => s >= 3600 ? fmtTime(s) : Math.round(s / 60) + " min";

function swatch(color) {
  return `background-color:${color};background-image:
    radial-gradient(circle at 50% 50%, rgba(255,255,255,.85) 0 3px, transparent 4px),
    radial-gradient(circle at 0 0, rgba(255,255,255,.85) 0 6px, transparent 7px),
    radial-gradient(circle at 100% 0, rgba(255,255,255,.85) 0 6px, transparent 7px),
    radial-gradient(circle at 0 100%, rgba(255,255,255,.85) 0 6px, transparent 7px),
    radial-gradient(circle at 100% 100%, rgba(255,255,255,.85) 0 6px, transparent 7px)`;
}
const countLabel = n => n === 0 ? "No recipes yet" : n === 1 ? "1 recipe" : n + " recipes";
const catOf = id => CATEGORIES.find(c => c.id === id);

/* ---------- Views ---------- */
function renderHome() {
  document.getElementById("cats").innerHTML = CATEGORIES.map(c => {
    const n = RECIPES.filter(r => r.category === c.id).length;
    return `<a class="cat" href="#${c.id}">
      <div class="swatch" style="${swatch(c.color)}"></div>
      <h2>${esc(c.name)}</h2>
      <p>${esc(c.blurb)}</p>
      <span class="count ${n ? "" : "zero"}">${countLabel(n)}</span>
    </a>`;
  }).join("");
}

function recipeCard(r) {
  const c = catOf(r.category);
  return `<a class="card" href="#${r.id}" style="border-top-color:${c.color}">
    ${r.photo
      ? `<div class="photo"><img src="${r.photo}" alt="${esc(r.title)}" loading="lazy">${r.standIn ? `<span class="standin">Stand-in photo</span>` : ""}</div>`
      : `<div class="photo placeholder" style="${swatch(c.color)};background-size:32px 32px"><span>${esc(r.title)}</span></div>`}
    <h3>${esc(r.title)}</h3>
    <p>${esc(r.blurb)}</p>
    <div class="meta">${r.chips.slice(0, 2).map(ch => `<span class="chip">${esc(ch[0])}</span>`).join("")}</div>
  </a>`;
}

function renderSearch() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const out = document.getElementById("results");
  if (!q) { out.innerHTML = ""; return; }
  const hits = RECIPES.filter(r =>
    (r.title + " " + r.blurb + " " + r.ingredients.map(i => i[2]).join(" ") + " " + r.chips.map(c => c[0]).join(" "))
      .toLowerCase().includes(q));
  out.innerHTML = hits.length
    ? `<div class="cards">${hits.map(recipeCard).join("")}</div>`
    : `<p style="color:var(--muted);margin:0">No recipes match “${esc(q)}”.</p>`;
}

function renderCategory(c) {
  const list = RECIPES.filter(r => r.category === c.id);
  document.getElementById("view-category").innerHTML = `
    <div class="cat-head">
      <h1>${esc(c.name)}</h1>
      <p>${esc(c.blurb)}</p>
    </div>
    ${list.length
      ? `<div class="cards">${list.map(recipeCard).join("")}</div>`
      : `<div class="empty"><strong>Nothing in ${esc(c.name)} yet.</strong>Recipes you add to this category will show up here.</div>`}`;
}

function renderRecipe(r) {
  const view = document.getElementById("view-recipe");
  servings[r.id] = servings[r.id] || r.serves;
  view.innerHTML = `
    <div class="recipe-head">
      ${r.photo ? `<div class="photo-wrap"><img class="recipe-photo" src="${r.photo}" alt="${esc(r.title)}">${r.standIn ? `<span class="standin">Stand-in photo</span>` : ""}</div>` : ""}
      <h1>${esc(r.title)}</h1>
      <p>${esc(r.blurb)}</p>
      <div class="meta">${r.chips.map(c => `<span class="chip ${c[1] || ""}">${esc(c[0])}</span>`).join("")}</div>
      ${r.source ? `<p class="source">Adapted from ${r.source[1] ? `<a href="${r.source[1]}" target="_blank" rel="noopener">${esc(r.source[0])}</a>` : esc(r.source[0])}</p>` : ""}
    </div>
    <div class="grid">
      <aside class="panel">
        <h2>Ingredients</h2>
        <div class="servings">
          <label for="srv">Makes</label>
          <span class="stepper">
            <button type="button" aria-label="Fewer" data-d="-1">−</button>
            <input id="srv" type="number" min="1" max="99" value="${servings[r.id]}">
            <button type="button" aria-label="More" data-d="1">+</button>
          </span>
          <span style="color:var(--muted);font-size:14px">${esc(r.unit)}</span>
          <span class="units" role="group" aria-label="Units">
            <button type="button" data-u="metric" aria-pressed="${metric}">g/ml</button>
            <button type="button" data-u="us" aria-pressed="${!metric}">oz/cups</button>
          </span>
        </div>
        <ul class="ingredients">
          ${r.ingredients.map((ing, i) => `
            <li><label for="ing-${i}">
              <input type="checkbox" id="ing-${i}">
              <span class="qty"></span>
              <span>${esc(ing[2])}</span>
            </label></li>`).join("")}
        </ul>
      </aside>
      <div>
        <ol class="steps">
          ${r.steps.map((s, i) => `
            <li><div>
              <h3>${esc(s[0])}</h3>
              <p>${esc(s[1])}</p>
              ${s[2] ? `<button type="button" class="timer" id="tm-${i}" data-secs="${s[2]}">${fmtLabel(s[2])} timer</button>` : ""}
            </div></li>`).join("")}
        </ol>
        ${r.note ? `<div class="note"><strong>${esc(r.note[0])}</strong>${esc(r.note[1])}</div>` : ""}
      </div>
    </div>`;

  const input = view.querySelector("#srv");
  const refresh = () => view.querySelectorAll(".qty").forEach((q, i) => {
    const ing = r.ingredients[i];
    const amt = ing[3] === "plus1" ? servings[r.id] + 1 : ing[0] * servings[r.id] / r.serves;
    q.textContent = fmtQty(amt, ing[1]);
  });
  const update = v => {
    v = Math.max(1, Math.min(99, parseInt(v) || 1));
    servings[r.id] = v; input.value = v; refresh();
  };
  input.addEventListener("change", () => update(input.value));
  view.querySelectorAll(".stepper button").forEach(b =>
    b.addEventListener("click", () => update(servings[r.id] + Number(b.dataset.d))));
  view.querySelectorAll(".units button").forEach(b =>
    b.addEventListener("click", () => {
      metric = b.dataset.u === "metric";
      view.querySelectorAll(".units button").forEach(x =>
        x.setAttribute("aria-pressed", String((x.dataset.u === "metric") === metric)));
      refresh();
    }));
  view.querySelectorAll(".timer").forEach(setupTimer);
  refresh();
}

let activeTimers = [];
function setupTimer(btn) {
  const total = Number(btn.dataset.secs);
  let left = total, iv = null;
  btn.addEventListener("click", () => {
    if (btn.classList.contains("done")) {
      btn.classList.remove("done"); left = total; btn.textContent = fmtLabel(total) + " timer"; return;
    }
    if (iv) { clearInterval(iv); iv = null; btn.classList.remove("running"); btn.textContent = "Paused · " + fmtTime(left); return; }
    btn.classList.add("running"); btn.textContent = fmtTime(left);
    iv = setInterval(() => {
      left--;
      if (left <= 0) {
        clearInterval(iv); iv = null;
        btn.classList.remove("running"); btn.classList.add("done");
        btn.textContent = "Done · tap to reset";
        try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {}
        return;
      }
      btn.textContent = fmtTime(left);
    }, 1000);
    activeTimers.push(() => clearInterval(iv));
  });
}

/* ---------- Routing ---------- */
function setCrumbs(parts) {
  document.getElementById("crumbs").innerHTML = parts.map((p, i) =>
    (i ? "<span aria-hidden='true'>›</span>" : "") +
    (p.href ? `<a href="${p.href}">${esc(p.label)}</a>` : `<span aria-current="page">${esc(p.label)}</span>`)
  ).join("");
}

function route() {
  activeTimers.forEach(f => f()); activeTimers = [];
  const id = location.hash.slice(1);
  const cat = catOf(id);
  const rec = RECIPES.find(r => r.id === id);
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));

  if (rec) {
    const c = catOf(rec.category);
    renderRecipe(rec);
    document.getElementById("view-recipe").classList.add("active");
    setCrumbs([{ label: "Home", href: "#home" }, { label: c.name, href: "#" + c.id }, { label: rec.title }]);
    document.title = rec.title + " · Recipe Book";
  } else if (cat) {
    renderCategory(cat);
    document.getElementById("view-category").classList.add("active");
    setCrumbs([{ label: "Home", href: "#home" }, { label: cat.name }]);
    document.title = cat.name + " · Recipe Book";
  } else {
    document.getElementById("view-home").classList.add("active");
    setCrumbs([]);
    document.title = "Recipe Book";
  }
  window.scrollTo(0, 0);
}

renderHome();
document.getElementById("q").addEventListener("input", renderSearch);
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
